<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>최종 시안 — 홈</title>
<link rel="stylesheet" href="../../app/static/css/fonts.css">
<link rel="stylesheet" href="v2b.css">
<link rel="stylesheet" href="v2s.css">
<style>
/* 최종 시안 — 홈(작업함, 스튜디오 틀). 왼쪽 남은 일 · 가운데 고른 일의 대상(이슈 초안 / 부서 자료 장 / 사례 카드) · 오른쪽 그 일의 동작.
   일 하나를 끝내면 다음 일이 자동으로 골라진다 */
.task{grid-template-columns:minmax(0,1fr) auto;cursor:pointer;font-size:var(--fs-2)}
.task .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.task .m{grid-column:1/-1;font-size:var(--fs-1);color:var(--muted)}
.task .ok{color:var(--t-ok);font-weight:700}
.case{width:520px}
.case h3{font-size:var(--fs-4)}
.case dl{display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px 12px;margin:0;font-size:var(--fs-3)}
.case dt{color:var(--muted);font-weight:600}
.done-all{max-width:520px;margin:80px auto;background:var(--surface);color:var(--fg);border-radius:var(--r);padding:20px;display:grid;gap:8px}
.mt{grid-template-columns:minmax(0,1fr) auto;font-size:var(--fs-2)}
.subg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:var(--fs-1);padding:4px}
</style>
</head>
<body>
<header class="tb" id="tb"></header>
<div class="studio">
  <aside class="pane left" aria-label="남은 일">
    <div class="seg" role="group" aria-label="시안 — 역할"><button type="button" data-role="w" aria-pressed="true">작성자</button><button type="button" data-role="d" aria-pressed="false">부서 편집자</button><button type="button" data-role="p" aria-pressed="false">기획</button></div>
    <div id="queue"></div>
  </aside>
  <main class="canvas" id="canvas" aria-label="캔버스"></main>
  <aside class="pane right" aria-label="동작" id="props"></aside>
</div>
<script type="module">
import {$, $$, esc, toast, fitStages} from './v2b.js';
import {ISSUES, MEETINGS, SUBMIT, KIND, deckOf, coverSlide} from './v2b-data.js';
import {toolbar, slide, frame} from './v2s.js';
toolbar('home', 'v2b-home.html');
$('#title').textContent = '이번 주 할 일'; $('#sub').textContent = '2026-W43 · 10.19–10.23';
let role = 'w', sel = 0;
const done = new Map();
const mine = () => ISSUES.filter((d) => d.dept === '시운전1부');
// 역할별 남은 일 — 실제 구현: 업데이트 필요·초안 미완료·종결 요청·제출 상태를 서버가 계산
function items() {
  if (role === 'w') return [
    ...mine().filter((d) => !d.wk && d.st !== 'post').map((d) => ({k: 'line', d, g: '이번 주 한 줄'})),
    ...mine().filter((d) => d.draft !== 'ok' && (d.wk || d.st === 'post')).map((d) => ({k: 'draft', d, g: '1차 초안 마무리'})),
  ];
  if (role === 'd') return [{k: 'deck', g: '부서 회의자료', title: 'W43 시운전1부 회의자료', sub: '마감 오늘 14:00'}, ...mine().filter((d) => d.draft !== 'ok').map((d) => ({k: 'nudge', d, g: '초안을 기다리는 이슈'}))];
  return [...ISSUES.filter((d) => d.st === 'req').map((d) => ({k: 'close', d, g: '종결 요청'})), {k: 'share', g: '공유회 자료', title: 'W43 부서 현안 공유회', sub: `제출 ${Object.values(SUBMIT).filter((v) => v === 'ok').length}/8`}];
}
const key = (it) => it.k + (it.d ? it.d.id : '');
function renderQueue() {
  const all = items(); let g = '', h = '';
  all.forEach((it, i) => {
    if (it.g !== g) { h += (g ? '</div>' : '') + `<div class="sec-h">${esc((g = it.g))}</div><div class="group">`; }
    const d = it.d, fin = done.has(key(it));
    h += `<div class="cell task ${i === sel ? 'on' : ''} ${fin ? 'fin' : ''}" data-i="${i}"><span class="t">${d ? `<span class="tl ${d.t}">${KIND[d.t]}</span> ${esc(d.title)}` : esc(it.title)}</span>${fin ? '<span class="ok">✓</span>' : '<span></span>'}<span class="m">${d ? `${d.hull} · ${esc(d.ev)}${d.dd !== null ? ' D-' + d.dd : ''} · 지난주 ${esc(d.last)}` : esc(it.sub)}</span></div>`;
  });
  $('#queue').innerHTML = h + (g ? '</div>' : '');
}
function renderCanvas() {
  const all = items(), left = all.filter((it) => !done.has(key(it))), it = all[sel];
  if (!left.length) { $('#canvas').innerHTML = `<div class="done-all"><b style="font-size:var(--fs-4)">이번 주 할 일을 마쳤습니다</b><span class="muted">${role === 'w' ? '부서 자료는 부장·부서 스텝이 고릅니다. 고친 내용이 있으면 알림으로 옵니다.' : role === 'd' ? '제출하면 공유회 자료에 자동으로 들어갑니다.' : '공유회 자료를 발행하면 회의를 시작할 수 있습니다.'}</span></div>`; return; }
  if (!it) { $('#canvas').innerHTML = ''; return; }
  let h = '';
  if (it.d && it.k !== 'close') h = `<p class="cv-h">${it.d.id} · 1차 초안 미리보기</p><div class="rowf">${frame(slide({id: it.d.id, line: it.d.wk || it.d.last, form: it.d.sym ? 'detail' : 'card'}, 1, 1, it.d.dept + ' · 1차 초안'), `<b>${esc(it.d.title)}</b>`, 'on static', '', 640)}</div>`;
  if (it.k === 'close') { const d = it.d; h = `<p class="cv-h">승인하면 이 사례 카드가 지식창고에 들어갑니다</p><div class="frame static case"><span class="lbl"><b>사례 카드 미리보기</b></span><div class="paper"><h3>${esc(d.title)}</h3><dl><dt>증상</dt><dd>${esc(d.sym || '—')}</dd><dt>원인</dt><dd>${esc(d.cause || '—')}</dd><dt>조치</dt><dd>${esc(d.act || '—')}</dd><dt>장비</dt><dd>${esc(d.eq || d.raw)} · ${d.hull}</dd></dl></div></div>`; }
  if (it.k === 'deck' || it.k === 'share') { const m = it.k === 'deck' ? 'hull' : 'share', its = deckOf(m).slice(0, 5); h = `<p class="cv-h">${esc(it.title)} — 지금 들어 있는 장</p><div class="rowf">${frame(coverSlide(it.title, its, its.length + 1), '<b>1 · 표지</b>', 'static', '', 300)}` + its.map((x, i) => frame(slide({id: x.d.id, line: x.line, form: 'card'}, i + 2, its.length + 1, it.title), `<b>${i + 2} · ${esc(x.d.hull)}</b>`, 'static', '', 300)).join('') + '</div>'; }
  $('#canvas').innerHTML = h; fitStages();
}
function renderProps() {
  const all = items(), it = all[sel];
  let h = '';
  if (it && !done.has(key(it))) {
    const d = it.d;
    if (it.k === 'line') h = `<div class="sec-h">이번 주 한 줄</div><div class="prop"><span class="small muted">지난주: ${esc(d.last)}</span><label class="sr" for="ln">이번 주 한 줄</label><input id="ln" type="text" placeholder="Enter 로 저장하고 다음 일로"><div class="row"><button class="btn sm primary" type="button" id="save">저장</button><button class="btn sm gray" type="button" id="same">변동 없음</button>${d.draft !== 'ok' ? `<a class="btn sm" href="v2s-issue.html?id=${d.id}">초안도 열기</a>` : ''}</div></div>`;
    if (it.k === 'draft') h = `<div class="sec-h">1차 초안</div><div class="prop"><span class="small muted">초안이 ${d.draft === 'wip' ? '작성 중' : '없습니다'} — 이슈 화면에서 칸을 채우면 됩니다</span><a class="btn primary" href="v2s-issue.html?id=${d.id}">초안 열기</a></div>`;
    if (it.k === 'deck') h = `<div class="sec-h">부서 회의자료</div><div class="prop"><span class="small muted">초안 완료 이슈가 이미 후보에 있습니다. 「지난주 이어받기」로 시작하면 빠릅니다.</span><a class="btn primary" href="v2s-studio.html?kind=dept">스튜디오에서 열기</a></div>`;
    if (it.k === 'nudge') h = `<div class="sec-h">초안 보완 요청</div><div class="prop"><span class="small muted">작성자에게 알림이 갑니다</span><button class="btn primary" type="button" id="nudge">보완 요청</button></div>`;
    if (it.k === 'close') h = `<div class="sec-h">종결 요청</div><div class="prop"><span class="small muted">기획 주관자는 회의 전에도 승인할 수 있습니다</span><div class="row"><button class="btn primary" type="button" id="close">종결 승인</button><button class="btn gray" type="button" id="hold">보류</button></div></div>`;
    if (it.k === 'share') h = `<div class="sec-h">공유회 자료</div><div class="prop"><span class="small muted">미제출: ${Object.entries(SUBMIT).filter(([, v]) => v !== 'ok').map(([k]) => k).join('·')} — 스튜디오에서 「원장으로 채우기」</span><a class="btn primary" href="v2s-studio.html?kind=share">스튜디오에서 열기</a></div>`;
  }
  h += `<div class="sec-h">다가오는 회의</div><div class="group">${MEETINGS.slice(1, 4).map((m) => `<a class="cell tap mt" href="v2s-meetings.html?m=${m.id}"><span style="display:grid"><b style="font-weight:600">${esc(m.title)}</b><span class="small muted">${esc(m.when)}</span></span><span class="chev"></span></a>`).join('')}</div>`;
  h += `<div class="sec-h">부서 제출 ${Object.values(SUBMIT).filter((v) => v === 'ok').length}/8 · 마감 수 14:00</div><div class="subg">${Object.entries(SUBMIT).map(([k, v]) => `<span>${k}</span><span class="st ${v === 'ok' ? 'done' : v === 'wip' ? 'go' : 'late'}">${v === 'ok' ? '제출' : v === 'wip' ? '작성 중' : '미작성'}</span>`).join('')}</div>`;
  h += '<div class="keys"><kbd>Enter</kbd> 저장하고 다음 일 · <kbd>↑</kbd><kbd>↓</kbd> 일 고르기</div>';
  $('#props').innerHTML = h;
  const left = items().filter((x) => !done.has(key(x))).length;
  $('#sub').textContent = `2026-W43 · 10.19–10.23 · 남은 일 ${left}`;
  $('#ln')?.focus({preventScroll: true});
}
const all = () => { renderQueue(); renderCanvas(); renderProps(); };
function nextOpen() { const xs = items(); for (let s = 1; s <= xs.length; s++) { const j = (sel + s) % xs.length; if (!done.has(key(xs[j]))) return j; } return sel; }
function finish(msg) { const it = items()[sel], k = key(it), at = sel; done.set(k, msg); sel = nextOpen(); all(); toast(msg, () => { done.delete(k); sel = at; all(); }); }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-i]'), r = e.target.closest('[data-role]');
  if (t) { sel = +t.dataset.i; all(); }
  if (r) { role = r.dataset.role; sel = 0; $$('[data-role]').forEach((x) => x.setAttribute('aria-pressed', x === r)); all(); }
  if (e.target.id === 'save') { const v = $('#ln').value.trim(); v ? finish(`W43 진행에 저장했습니다 — 「${v}」`) : $('#ln').focus(); }
  if (e.target.id === 'same') finish('W43 「변동 없음」으로 남겼습니다');
  if (e.target.id === 'nudge') finish('작성자에게 초안 보완을 요청했습니다');
  if (e.target.id === 'close') finish('종결 승인 — 사례 카드를 만들었습니다');
  if (e.target.id === 'hold') finish('보류 — 공유회에서 다시 봅니다');
});
addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'ln' && e.target.value.trim()) { e.preventDefault(); finish(`W43 진행에 저장했습니다 — 「${e.target.value.trim()}」`); return; }
  if (e.target.closest?.('input,textarea,select')) return;
  if (e.key === 'ArrowDown') { sel = Math.min(items().length - 1, sel + 1); all(); }
  if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); all(); }
});
all();
</script>
</body>
</html>
