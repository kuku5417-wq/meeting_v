<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v2 와이드 스튜디오 — 시안</title>
<link rel="stylesheet" href="../../app/static/css/fonts.css">
<link rel="stylesheet" href="v2b.css">
<link rel="stylesheet" href="v2m.css?v=2">
<style>
/* ── 와이드 4열: 장 목록(160px) │ 후보(240px) │ 캔버스(1fr) │ 속성(300px) ──
   분리 경계: 후보 → 클릭 한 번으로 캔버스에 올림 → 속성에서 형태·한 줄 조정.
   후보 열이 항상 열려 있어 「지난주 자료에 있던 것」을 주역으로 볼 수 있다. */
body{padding-left:0;height:100vh;overflow:hidden;display:grid;grid-template-rows:52px minmax(0,1fr)}
.tb{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--surface);box-shadow:0 1px 0 var(--sep);z-index:5}
.tb .back{font-weight:600;white-space:nowrap}
.tb .ttl{display:grid;line-height:1.2;margin-right:auto;min-width:0}
.tb .ttl b{font-size:var(--fs-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .ttl span{font-size:var(--fs-1);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{display:flex;align-items:center;gap:2px;background:var(--fill);border-radius:8px;padding:2px}
.zoom button{font:inherit;font-size:var(--fs-2);border:0;background:none;color:var(--fg);min-width:30px;min-height:28px;border-radius:6px;cursor:pointer}
.zoom button:hover{background:var(--surface)}
.zoom output{font-family:var(--mono);font-size:var(--fs-1);min-width:44px;text-align:center}

/* ── 4열 스튜디오 ── */
.studio{display:grid;grid-template-columns:160px 240px minmax(0,1fr) 300px;min-height:0}
.pane{background:var(--surface);overflow:auto;display:grid;align-content:start;gap:8px;padding:10px;min-height:0}
.pane.layers-pane{box-shadow:1px 0 0 var(--sep)}
.pane.cands-pane{background:var(--fill-2);box-shadow:1px 0 0 var(--sep)}
.pane.props-pane{box-shadow:-1px 0 0 var(--sep)}
.pane .group{box-shadow:none;background:var(--fill-2)}
.pane .cell{background:transparent;min-height:36px;padding:6px 10px}
.pane .cell+.cell::before{left:10px}
.pane .sec-h{padding:0 4px;margin-top:4px}

/* 장 목록 — 조밀, 번호 + 제목만 */
.lyr{grid-template-columns:22px minmax(0,1fr);cursor:pointer;font-size:var(--fs-2)}
.lyr .n{font-family:var(--mono);color:var(--muted);font-size:var(--fs-1)}
.lyr .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr .f{font-size:var(--fs-1);color:var(--muted)}
.lyr.on{background:var(--accent)!important;color:var(--accent-fg)}
.lyr.on .n,.lyr.on .f{color:var(--accent-fg)}
.lyr.multi{background:var(--accent-soft)!important}
.lyr.dragging{opacity:.4} .lyr.over{box-shadow:inset 0 2px 0 var(--accent)}

/* 후보 목록 — 넓어서 메타 정보 표시 가능 */
.cand{grid-template-columns:minmax(0,1fr) auto;font-size:var(--fs-2)}
.cand .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .m{grid-column:1;font-size:var(--fs-1);color:var(--muted)}

/* 후보 패널 헤더 */
.cands-header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0}
.cands-header h3{font-size:var(--fs-2);color:var(--muted);font-weight:600;letter-spacing:.02em}
.dsub{grid-template-columns:minmax(0,1fr) auto;font-size:var(--fs-2)}

/* 캔버스 */
.canvas{background:#2b2d31;overflow:auto;padding:28px 36px 80px;min-height:0}
.rowf{display:flex;gap:28px;align-items:flex-start;margin-bottom:34px}
.frame{flex:0 0 auto;display:grid;gap:6px;cursor:pointer}
.frame .lbl{font-size:var(--fs-1);color:#c7c9ce;white-space:nowrap;display:flex;gap:8px}
.frame .lbl b{color:#fff;font-weight:600}
.frame .stage-wrap{border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.frame.on .stage-wrap{outline:3px solid #4c9bff;outline-offset:2px}
.frame.multi .stage-wrap{outline:3px dashed #4c9bff;outline-offset:2px}
.frame:hover .stage-wrap{outline:2px solid #8bbcff;outline-offset:2px}
.frame.var{opacity:.55} .frame.var:hover{opacity:1} .frame.var .lbl{color:#9da1a8}
.vars-h{font-size:var(--fs-1);color:#9da1a8;align-self:center;writing-mode:vertical-rl;letter-spacing:.1em}
.startc{max-width:480px;margin:60px auto;background:var(--surface);border-radius:var(--r);padding:20px;display:grid;gap:12px}

/* 속성 */
.prop{display:grid;gap:6px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vgrid button{font:inherit;font-size:var(--fs-1);font-weight:600;border:0;border-radius:8px;background:var(--fill);color:var(--fg);padding:4px;cursor:pointer;display:grid;gap:4px}
.vgrid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.vgrid .mini{aspect-ratio:16/9;background:#fff;border-radius:4px;display:grid;gap:3px;padding:5px;align-content:start}
.vgrid .mini i{display:block;height:4px;border-radius:2px;background:#c8d0db}
.vgrid .mini i.b{height:12px;background:#e3e8ef} .vgrid .mini i.s{width:60%}
.fact{display:grid;gap:6px;padding:10px;border-radius:8px;background:var(--ok-soft)}
.fact .lbl{font-size:var(--fs-1);font-weight:700;color:var(--t-ok)} .fact .lbl::before{content:"● "}
.fact input{background:var(--surface)!important}
.expr{font-size:var(--fs-1);font-weight:700;color:var(--muted)} .expr::before{content:"○ "}
.ptag{font:inherit;font-size:var(--fs-2);font-weight:700;border:0;color:var(--t-decide);background:var(--decide-soft);border-radius:8px;padding:3px 10px;cursor:pointer;min-height:30px;justify-self:start}
.ptag[aria-pressed="false"]{text-decoration:line-through;background:var(--fill);color:var(--muted)}
.empty{padding:16px;color:var(--muted);font-size:var(--fs-2)}
.keys{font-size:var(--fs-1);color:var(--muted);line-height:1.7}
.keys kbd{font-family:var(--mono);background:var(--fill);border-radius:4px;padding:0 5px}
.adj{display:grid;gap:8px}
.adj label.f{display:grid;gap:3px;font-size:var(--fs-1);color:var(--fg)}
.adj-row{display:flex;align-items:center;gap:6px}
.adj-row input[type=range]{flex:1;accent-color:var(--accent)}
.adj-val{font-family:var(--mono);font-size:var(--fs-1);color:var(--muted);min-width:38px;text-align:right}
.adj textarea{width:100%;box-sizing:border-box;resize:vertical;font:inherit;font-size:var(--fs-1);border:1px solid var(--sep);border-radius:6px;padding:6px 8px;background:var(--field);color:var(--fg)}

/* 반응형: 1200px 이하 → 후보 열 숨김(기존 3열로), 900px 이하 → 모바일 */
@media(max-width:1200px){.studio{grid-template-columns:200px minmax(0,1fr) 280px}.cands-pane{display:none}}
@media(max-width:900px){body{height:auto;overflow:auto;grid-template-rows:auto auto}.tb{flex-wrap:wrap;padding:8px}.studio{grid-template-columns:minmax(0,1fr)}.canvas{min-height:60vh;padding:16px}.layers-pane,.props-pane{display:none}}
</style>
</head>
<body>
<header class="tb">
  <a class="back" href="v2m-meetings.html">‹ 회의</a>
  <div class="ttl"><b id="title"></b><span id="sub"></span></div>
  <div class="seg" role="group" aria-label="시안 — 갈래" id="kinds">
    <button type="button" data-k="dept">부서 자료</button>
    <button type="button" data-k="share">공유회</button>
    <button type="button" data-k="exec">팀장 정보회의</button>
  </div>
  <div class="zoom" aria-label="확대">
    <button type="button" id="zOut" aria-label="축소">−</button>
    <output id="zv">100%</output>
    <button type="button" id="zIn" aria-label="확대">＋</button>
    <button type="button" id="zFit">맞춤</button>
  </div>
  <button class="btn sm gray" type="button" id="ppt">PPT</button>
  <a class="btn sm gray" href="#" id="present">발표 미리보기</a>
  <button class="btn sm primary" type="button" id="primary"></button>
</header>

<div class="studio">

  <!-- ── 열 1: 장 목록 (조밀, 순서 조정) ── -->
  <aside class="pane layers-pane" aria-label="장 목록">
    <div class="cands-header">
      <h3>장 <span class="mono" id="nL" style="color:var(--fg)"></span></h3>
      <span class="small muted">끌어서 순서</span>
    </div>
    <div class="group" id="layers"></div>
    <span class="small muted" style="padding:0 4px">Shift+클릭 여러 장</span>
  </aside>

  <!-- ── 열 2: 후보 (항상 열려 있음 — 주역) ── -->
  <aside class="pane cands-pane" aria-label="후보">
    <div class="cands-header">
      <h3>후보 <span class="mono" id="nC" style="color:var(--fg)"></span></h3>
      <span class="small muted">＋ 로 장에 추가</span>
    </div>
    <div id="candP"></div>
  </aside>

  <!-- ── 가운데: 캔버스 ── -->
  <main class="canvas" id="canvas" aria-label="캔버스"></main>

  <!-- ── 열 4: 속성 ── -->
  <aside class="pane props-pane" aria-label="속성" id="props"></aside>

</div>

<script type="module">
import {$, $$, esc, toast, fitStages} from './v2b.js';
import {ISSUES, KIND, SUBMIT, ptag, byId, MEETING, itemSlide, coverSlide} from './v2b-data.js';

const qs = new URLSearchParams(location.search);
const kind = ['dept', 'share', 'exec'].includes(qs.get('kind')) ? qs.get('kind') : 'dept';
$$('#kinds [data-k]').forEach((b) => {
  b.setAttribute('aria-pressed', b.dataset.k === kind);
  b.onclick = () => (location.search = '?kind=' + b.dataset.k);
});

const K = {
  dept:  {title: 'W43 시운전1부 회의자료', sub: '부서 회의자료 · 마감 10/22(수) 14:00 → 부서 현안 공유회',           main: '제출',   after: ['공유회 자료 보기 →', 'v2m-meeting-view.html?m=share'], form: 'card', fact: true},
  share: {title: MEETING.share,             sub: '부서 현안 공유회 · 기획 취합 · 부서 제출본은 참조',                 main: '발행',   after: ['회의 시작 →',    'v2m-meeting-run.html?m=share'],        form: 'card', fact: false},
  exec:  {title: MEETING.exec,              sub: '팀장 정보회의 · 같은 이슈를 한 줄로 다시 구성',                     main: '발행',   after: ['회의 시작 →',    'v2m-meeting-run.html?m=exec'],         form: 'line', fact: false},
}[kind];

$('#title').textContent = K.title;

const FORMS = {detail: '상세 한 장', card: '카드', photo: '사진 강조', line: '한 줄'};
const mine = ISSUES.filter((d) => d.dept === '시운전1부');
const LAST = ['ISS-2026-0001', 'PRB-2026-0001', 'ISS-2026-0020', 'PRB-2026-0018'];

// 후보 묶음 — 갈래마다 다름. 「지난주 자료에 있던 것」이 첫 번째 그룹.
const GROUPS = kind === 'dept'
  ? [
      ['지난주 자료에 있던 것',         mine.filter((d) => LAST.includes(d.id))],
      ['새 초안 완료',                  mine.filter((d) => d.draft === 'ok' && !LAST.includes(d.id))],
      ['초안 작성 중 — 넣으면 경고만', mine.filter((d) => d.draft !== 'ok' && !LAST.includes(d.id))],
    ]
  : kind === 'share'
  ? [
      ['종결 요청',              ISSUES.filter((d) => d.st === 'req')],
      ['일정 임박 (D-14 이내)', ISSUES.filter((d) => d.dd !== null && d.dd <= 14 && d.st !== 'req')],
      ['그 밖의 열린 이슈',     ISSUES.filter((d) => !(d.dd !== null && d.dd <= 14) && d.st !== 'req')],
    ]
  : [
      ['공유회 채택분',      ISSUES.filter((d) => ['ISS-2026-0001', 'PRB-2026-0001', 'ISS-2026-0009'].includes(d.id))],
      ['중요 표시',          ISSUES.filter((d) => d.important)],
      ['장기 미결 (4주+)',   ISSUES.filter((d) => d.weeks >= 4 && !d.important)],
    ];

const mk = (d, src) => ({id: d.id, line: d.wk || d.last, form: K.form, tag: true, src, adj: {}});
let items = [], sel = 0, zoom = 1, published = false, started = true;
const multi = new Set();

if (kind === 'dept')  items = GROUPS[0][1].map((d) => mk(d, '지난주')).concat(GROUPS[1][1].map((d) => mk(d, '새 초안')));
if (kind === 'share') items = ISSUES.filter((d) => SUBMIT[d.dept] === 'ok' || d.dept === '시운전1부').slice(0, 6).map((d) => mk(d, d.dept + ' 제출'));
if (kind === 'exec')  items = GROUPS[0][1].concat(GROUPS[1][1]).map((d) => mk(d, '공유회'));
items.forEach((it) => { if (byId(it.id).sym && kind !== 'exec' && byId(it.id).dec) it.form = 'detail'; });

// 형태별 한 장(1920 좌표)
function slide(it, n, total, title) {
  const d = byId(it.id), p = ptag(d), pre = p && it.tag ? `<b style="color:var(--t-decide)">[${esc(p)}]</b> ` : '';
  const a = it.adj || {};
  const sc = (a.textScale || 100) / 100;
  const lh = (a.lineHeight || 150) / 100;
  const pad = a.padding || 48;
  const noteHtml = a.note ? `<div style="font-size:${Math.round(24*sc)}px;margin-top:20px;padding:20px 24px;background:#f0f4f8;border-radius:12px;color:#3a4a5c">${esc(a.note)}</div>` : '';
  const head = `<div class="sh"><span>${esc(title)}</span><span>${esc(it.ids ? '요약 · ' + it.ids.length + '건' : d.dept)}</span></div>`;
  const foot = `<div class="sf"><span>${n} / ${total} · ${esc(it.ids ? it.ids.map((x) => byId(x).hull).join('·') : d.hull ? d.hull + ' · ' + d.ev + (d.dd !== null ? ' D-' + d.dd : '') : '부서 현황')}</span><span>${esc(FORMS[it.form])}</span></div>`;
  if (it.ids) return head + `<div class="sb" style="padding:${pad}px;line-height:${lh}"><div class="st1">${esc(it.line)}</div>${it.ids.map((x) => { const e = byId(x); return `<div class="li ${e.t}"><b>${esc(e.title)}</b>${esc(e.wk || e.last)}</div>`; }).join('')}${noteHtml}</div>` + foot;
  const t = `<div class="st1"><span class="lab" style="background:var(--t-${d.t})">${KIND[d.t]}</span>${esc(d.title)}</div>`;
  if (it.form === 'detail') return itemSlide({d, line: it.line}, n, total, null, title).replace(/<div style="font-size:30px">[^]*?<\/div>/, `<div style="font-size:30px">${pre}${esc(it.line)}</div>`);
  if (it.form === 'photo')  { const imgSc=(a.imgScale||100)/100, imgY=a.imgOffsetY||0; return head + `<div class="sb" style="padding:${pad}px;line-height:${lh}">${t}<div style="display:grid;grid-template-columns:1.3fr 1fr;gap:32px"><div style="overflow:hidden;background:#e3e8ef;border-radius:16px;min-height:520px;display:grid;place-items:center;color:#5d6e86;font-size:${Math.round(30*sc)}px"><div style="transform:scale(${imgSc}) translateY(${imgY}px);transform-origin:center">사진 · 마커</div></div><div style="display:grid;gap:20px;align-content:start;font-size:${Math.round(30*sc)}px">${pre}${esc(it.line)}${d.dec ? `<div class="decide"><b>결정 필요</b> ${esc(d.dec)}</div>` : ''}</div></div>${noteHtml}</div>` + foot; }
  if (it.form === 'line')   return head + `<div class="sb" style="align-content:center;padding:${pad}px">${t}<div style="font-size:${Math.round(40*sc)}px;line-height:${lh}">${pre}${esc(it.line)}</div>${noteHtml}</div>` + foot;
  return head + `<div class="sb" style="padding:${pad}px;line-height:${lh}">${t}<div style="display:grid;grid-template-columns:1fr 360px;gap:28px"><div style="display:grid;gap:16px;font-size:${Math.round(30*sc)}px;align-content:start">${pre}${esc(it.line)}<div class="grid4"><div><b>담당</b>${esc(d.dept)}</div><div><b>상태</b>${d.st === 'req' ? '종결 요청' : '진행'}</div></div></div><div style="background:#e3e8ef;border-radius:16px;min-height:300px"></div></div>${d.dec ? `<div class="decide"><b>결정 필요</b> ${esc(d.dec)}</div>` : ''}${noteHtml}</div>` + foot;
}

const W = () => Math.round(560 * zoom);
const frame = (html, label, cls, attrs) => `<div class="frame ${cls}" ${attrs} style="width:${W()}px"><span class="lbl">${label}</span><div class="stage-wrap"><div class="stage">${html}</div></div></div>`;

function renderCanvas() {
  if (!started) {
    $('#canvas').innerHTML = `<div class="startc">
      <b style="font-size:var(--fs-4)">이번 주 자료를 어떻게 시작할까요?</b>
      <div class="row">
        <button class="btn primary" type="button" data-start="carry">지난주 이어받기 — ${LAST.length}건 + 새 초안 ${GROUPS[1][1].length}건</button>
        <button class="btn gray"    type="button" data-start="blank">빈 자료에서 — 왼쪽 후보에서 고르기</button>
      </div>
      <span class="small muted">다음 주에는 이번에 고른 방식으로 바로 시작합니다.</span>
    </div>`;
    return;
  }
  const total = items.length + 1;
  let h = `<div class="rowf">${frame(coverSlide(K.title, items.map((x) => ({d: byId(x.id)})), total), '<b>1 · 표지</b>', '', '')}</div>`;
  items.forEach((it, i) => {
    const on = i === sel;
    h += `<div class="rowf" data-row="${i}">${frame(slide(it, i + 2, total, K.title), `<b>${i + 2} · ${esc((it.ids ? it.line : byId(it.id).title).slice(0, 28))}</b><span>${FORMS[it.form]}</span>`, on ? 'on' : multi.has(i) ? 'multi' : '', `data-f="${i}"`)}`;
    if (on && multi.size < 2 && !it.ids) h += `<span class="vars-h">다른 형태</span>` + Object.keys(FORMS).filter((k) => k !== it.form).map((k) => frame(slide({...it, form: k}, i + 2, total, K.title), `<b>${FORMS[k]}</b> 로 바꾸기`, 'var', `data-var="${k}"`)).join('');
    h += '</div>';
  });
  if (!items.length) h += '<div class="startc"><b>장이 없습니다</b><span class="small muted">왼쪽 후보에서 ＋ 를 누르면 장이 생깁니다.</span></div>';
  $('#canvas').innerHTML = h;
  requestAnimationFrame(fitStages);
}

function renderLeft() {
  // 장 목록 (열 1)
  $('#layers').innerHTML = `<div class="cell lyr" style="cursor:default"><span class="n">1</span><span class="t">표지</span></div>`
    + items.map((it, i) => {
        const d = byId(it.id);
        return `<div class="cell lyr ${i === sel ? 'on' : multi.has(i) ? 'multi' : ''}" data-l="${i}" draggable="true">
          <span class="n">${i + 2}</span>
          <span class="t">${it.ids ? `<span class="tl decide" style="margin-right:4px;font-size:11px">요약</span>${esc(it.line)}` : `<span class="tl ${d.t}" style="margin-right:4px;font-size:11px">${KIND[d.t]}</span>${esc(d.title)}`}</span>
          <span class="f">${FORMS[it.form]}</span>
        </div>`;
      }).join('');

  // 후보 목록 (열 2)
  const used = new Set(items.flatMap((x) => x.ids || [x.id]));
  let h = '';
  if (kind === 'share') {
    h += `<div class="sec-h">부서 제출 — 마감 수 14:00 지남</div><div class="group">` +
      Object.entries(SUBMIT).map(([dpt, v]) =>
        `<div class="cell dsub"><span>${dpt} <span class="st ${v === 'ok' ? 'done' : 'late'}">${v === 'ok' ? '제출' : v === 'wip' ? '작성 중' : '미작성'}</span></span>${v === 'ok' ? '' : `<button class="btn sm" type="button" data-fill="${dpt}">원장으로 채우기</button>`}</div>`
      ).join('') + '</div>';
  }

  let nC = 0;
  h += GROUPS.map(([g, xs]) => {
    const rest = xs.filter((d) => !used.has(d.id));
    nC += rest.length;
    if (!rest.length) return '';
    return `<div class="sec-h">${g} <span class="mono" style="color:var(--fg)">${rest.length}</span></div><div class="group">` +
      rest.map((d) =>
        `<div class="cell cand">
          <span class="t"><span class="tl ${d.t}" style="margin-right:4px;font-size:11px">${KIND[d.t]}</span>${esc(d.title)}</span>
          <button class="btn sm" type="button" data-add="${d.id}" aria-label="${d.id} 장으로 넣기">＋</button>
          <span class="m">${d.id} · ${d.dept}${d.map < 3 ? ' · 매핑 ' + d.map + '/5' : ''}</span>
        </div>`
      ).join('') + '</div>';
  }).join('');

  $('#candP').innerHTML = h || '<div class="empty">모든 후보가 들어가 있습니다</div>';
  $('#nL').textContent = items.length + 1;
  $('#nC').textContent = nC;
}

function adjPanel(it) {
  const a = it.adj || {};
  const sl = (key, label, min, max, val, fmt) => `<label class="f">${label}<div class="adj-row"><input type="range" min="${min}" max="${max}" data-adj="${key}" value="${val}"><span class="adj-val">${fmt(val)}</span></div></label>`;
  return sl('textScale','글씨 크기',50,150,a.textScale||100,v=>v+'%')
    + sl('lineHeight','줄 간격',100,220,a.lineHeight||150,v=>(v/100).toFixed(1))
    + sl('padding','여백',20,100,a.padding||48,v=>v+'px')
    + (it.form==='photo' ? sl('imgScale','사진 크기',30,200,a.imgScale||100,v=>v+'%') + sl('imgOffsetY','사진 위치 ↕',-300,300,a.imgOffsetY||0,v=>(v>0?'+':'')+v+'px') : '')
    + `<label class="f">추가 텍스트<textarea data-adj="note" rows="2" placeholder="이 장에만 추가할 텍스트">${esc(a.note||'')}</textarea></label>`;
}

const mini = (k) => ({
  detail: '<i></i><i class="s"></i><i class="b"></i><i class="b"></i>',
  card:   '<i></i><i class="s"></i><i class="b" style="width:40%;justify-self:end;height:22px"></i>',
  photo:  '<i></i><i class="b" style="height:30px;width:60%"></i>',
  line:   '<i style="margin-top:12px"></i><i class="s"></i>',
}[k]);

const KEYS = '<div class="keys"><kbd>↑</kbd><kbd>↓</kbd> 장 고르기 · <kbd>1</kbd>~<kbd>4</kbd> 형태 · <kbd>Delete</kbd> 빼기 · <kbd>Ctrl</kbd>+<kbd>S</kbd> ' + K.main + '</div>';

function renderProps() {
  if (multi.size >= 2) {
    $('#props').innerHTML = `<div class="prop"><b>${multi.size}장 골랐습니다</b><span class="small muted">같은 원인·장비라면 한 장으로 묶어 보여 줄 수 있습니다.</span></div><button class="btn primary" type="button" id="sumBtn">고른 ${multi.size}장 한 장으로 요약</button><button class="btn gray" type="button" id="clrM">고르기 풀기</button>` + KEYS;
    return;
  }
  const it = items[sel];
  if (!it) { $('#props').innerHTML = '<div class="empty">장을 고르면 여기에서 형태·한 줄·사실을 고칩니다</div>' + KEYS; return; }
  const d = byId(it.id), p = ptag(d);
  if (it.ids) {
    $('#props').innerHTML = `<div class="prop"><span class="small muted">${sel + 2}장 · 요약</span><b>이슈 ${it.ids.length}건 묶음</b><span class="meta">${it.ids.map((x) => `<a href="v2w-issue-desk.html?id=${x}">${x}</a>`).join(' ')}</span></div><div class="sec-h">요약 문장</div><div class="prop"><span class="expr">이 자료에만 — 각 이슈는 그대로</span><input type="text" id="ln" value="${esc(it.line)}"></div><div class="row"><button class="btn sm gray" type="button" id="unsum">요약 풀기</button><button class="btn sm gray" type="button" id="drop">이 장 빼기</button></div>` + KEYS;
    return;
  }
  $('#props').innerHTML = `
    <div class="prop">
      <span class="small muted">${sel + 2}장 · ${d.id}${it.src ? ' · ' + esc(it.src) : ''}</span>
      <b>${esc(d.title)}</b>
      <span class="meta"><span>${d.dept}</span><span class="dd ${d.dd !== null && d.dd <= 14 ? 'soon' : ''}">${d.hull ? d.hull + ' · ' + esc(d.ev) + (d.dd !== null ? ' D-' + d.dd : '') : '부서 현황'}</span>${d.draft !== 'ok' ? '<span class="st late">초안 작성 중</span>' : ''}</span>
    </div>
    <div class="sec-h">형태 — 캔버스 옆 변형을 눌러도 됩니다</div>
    <div class="vgrid">${Object.entries(FORMS).map(([k, v], n) => `<button type="button" data-form="${k}" aria-pressed="${k === it.form}"><span class="mini">${mini(k)}</span>${n + 1}. ${v}</button>`).join('')}</div>
    <div class="sec-h">회의용 한 줄</div>
    <div class="prop">
      <span class="expr">이 자료에만 — 이슈는 그대로</span>
      ${p ? `<button class="ptag" type="button" id="tag" aria-pressed="${it.tag}">[${esc(p)}]</button>` : ''}
      <label class="sr" for="ln">회의용 한 줄</label>
      <input type="text" id="ln" value="${esc(it.line)}">
    </div>
    ${K.fact
      ? `<div class="sec-h">사실</div><div class="fact"><span class="lbl">고치면 이슈에 바로 반영 · 작성자 알림</span><label class="f">원인<input type="text" data-fact="cause" value="${esc(d.cause || '')}" placeholder="조사 중"></label><label class="f">조치 · 계획<input type="text" data-fact="act" value="${esc(d.act || '')}"></label><label class="f">결정 필요<input type="text" data-fact="dec" value="${esc(d.dec || '')}"></label></div>`
      : `<span class="small muted">사실 수정은 이슈에서 — 여기서는 순서·형태·한 줄만</span>`
    }
    <div class="row" style="margin-top:4px">
      <a class="btn sm gray" href="v2w-issue-desk.html?id=${d.id}">이슈 열기</a>
      <button class="btn sm gray" type="button" id="drop">이 장 빼기</button>
    </div>
    <div class="sec-h" style="margin-top:8px">미세 조정 — 이 장에만</div>
    <div class="adj">${adjPanel(it)}</div>` + KEYS;
}

function state() {
  const n = items.length;
  $('#sub').textContent = published
    ? `${K.sub.split(' · ')[0]} · ${K.main === '제출' ? '제출함' : '발행 1판'} · 이후 바뀐 사실은 「변경」으로 표시`
    : `${K.sub} · 장 ${n + 1} · 자동 저장됨`;
  $('#primary').textContent = published ? K.after[0] : K.main;
}

const all = () => { renderLeft(); renderCanvas(); renderProps(); state(); };
function pick(i, scroll = true) { multi.clear(); sel = Math.max(0, Math.min(items.length - 1, i)); all(); if (scroll) $(`[data-row="${sel}"]`)?.scrollIntoView({block: 'center', behavior: 'smooth'}); }
function setForm(k) { const it = items[sel]; if (!it || it.ids || it.form === k) return; const b = it.form; it.form = k; all(); toast(`${sel + 2}장을 「${FORMS[k]}」로 바꿨습니다`, () => { it.form = b; all(); }); }
function drop() { if (!items.length) return; const i = sel, x = items.splice(i, 1)[0]; sel = Math.max(0, Math.min(i, items.length - 1)); all(); toast(`${x.ids ? '요약' : '「' + byId(x.id).title + '」'} 장을 뺐습니다`, () => { items.splice(i, 0, x); pick(i); }); }

function main() {
  if (published) { location.href = K.after[1]; return; }
  published = true; all();
  toast(K.main === '제출' ? '제출했습니다 — 공유회 자료에 들어갔습니다' : '발행했습니다 — 이 판은 고정됩니다', () => { published = false; all(); });
}

document.addEventListener('click', (e) => {
  const f   = e.target.closest('[data-f]');
  const v   = e.target.closest('[data-var]');
  const l   = e.target.closest('[data-l]');
  const fm  = e.target.closest('[data-form]');
  const add = e.target.closest('[data-add]');
  const st  = e.target.closest('[data-start]');
  const fill= e.target.closest('[data-fill]');
  if (st) {
    started = true;
    if (st.dataset.start === 'carry') items = GROUPS[0][1].map((d) => mk(d, '지난주')).concat(GROUPS[1][1].map((d) => mk(d, '새 초안')));
    sel = 0; all();
    toast(st.dataset.start === 'carry' ? `지난주 ${LAST.length}건 + 새 초안 ${GROUPS[1][1].length}건으로 시작했습니다` : '빈 자료로 시작했습니다 — 왼쪽 후보에서 넣으세요');
    return;
  }
  if (v) return setForm(v.dataset.var);
  if ((f || l) && e.shiftKey) { const i = +((f || l).dataset[f ? 'f' : 'l']); if (!multi.size) multi.add(sel); multi.has(i) ? multi.delete(i) : multi.add(i); all(); return; }
  if (f) return pick(+f.dataset.f, false);
  if (l) return pick(+l.dataset.l);
  if (fm) return setForm(fm.dataset.form);
  if (e.target.id === 'tag') { items[sel].tag = !items[sel].tag; all(); return; }
  if (e.target.id === 'drop') return drop();
  if (e.target.id === 'clrM') { multi.clear(); all(); return; }
  if (e.target.id === 'sumBtn') {
    const idx = [...multi].sort((a, b) => a - b), pickd = idx.map((i) => items[i]), ids = pickd.flatMap((x) => x.ids || [x.id]);
    const at = idx[0]; items = items.filter((_, i) => !multi.has(i));
    items.splice(at, 0, {id: ids[0], ids, line: `${ids.length}건 묶음 — ${[...new Set(ids.map((x) => byId(x).hull))].join('·')} 같은 원인 검토`, form: 'card', tag: false, src: `요약 · 이슈 ${ids.length}개 연결`});
    multi.clear(); sel = at; all();
    toast(`${ids.length}건을 한 장으로 묶었습니다 — 각 이슈는 그대로입니다`, () => { items.splice(at, 1, ...pickd); pick(at); });
    return;
  }
  if (e.target.id === 'unsum') { const it = items[sel], parts = it.ids.map((x) => mk(byId(x), '요약에서 풂')); items.splice(sel, 1, ...parts); all(); return; }
  if (add) {
    const d = byId(add.dataset.add);
    started = true; items.push(mk(d, kind === 'dept' ? '새로 넣음' : '원장에서')); pick(items.length - 1);
    toast(`「${d.title}」을 ${items.length + 1}장으로 넣었습니다`, () => { items = items.filter((x) => x.id !== d.id || x.ids); pick(sel); });
    return;
  }
  if (fill) {
    const dpt = fill.dataset.fill, usedSet = new Set(items.flatMap((x) => x.ids || [x.id])), add2 = ISSUES.filter((d) => d.dept === dpt && !usedSet.has(d.id));
    add2.forEach((d) => items.push(mk(d, dpt + ' · 원장 자동'))); all();
    toast(add2.length ? `${dpt} 미제출 — 열린 이슈 ${add2.length}건을 원장에서 채웠습니다` : `${dpt}: 원장에 열린 이슈가 없어 「미제출」로만 표시합니다`);
    return;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'ln') { items[sel].line = e.target.value; renderCanvas(); }
  if (e.target.dataset.fact) { byId(items[sel].id)[e.target.dataset.fact] = e.target.value; renderCanvas(); $('#sub').textContent = `● ${items[sel].id} 이슈에 반영됨 · 작성자에게 알림`; }
  if (e.target.dataset.adj) {
    if (!items[sel].adj) items[sel].adj = {};
    const key = e.target.dataset.adj;
    items[sel].adj[key] = e.target.type === 'range' ? +e.target.value : e.target.value;
    const valEl = e.target.closest('.adj-row')?.querySelector('.adj-val');
    if (valEl) valEl.textContent = key === 'lineHeight' ? (+e.target.value/100).toFixed(1) : key === 'imgOffsetY' ? (e.target.value>0?'+':'')+e.target.value+'px' : key.endsWith('Scale') ? e.target.value+'%' : e.target.value+'px';
    renderCanvas();
  }
});

addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); main(); return; }
  if (e.target.closest?.('input,textarea,select')) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); pick(sel + 1); }
  if (e.key === 'ArrowUp')   { e.preventDefault(); pick(sel - 1); }
  if (['1', '2', '3', '4'].includes(e.key)) setForm(Object.keys(FORMS)[+e.key - 1]);
  if (e.key === 'Delete') { e.preventDefault(); drop(); }
});

let dragI = null;
document.addEventListener('dragstart', (e) => { const l = e.target.closest('[data-l]'); if (l) { dragI = +l.dataset.l; l.classList.add('dragging'); } });
document.addEventListener('dragover',  (e) => { const l = e.target.closest('[data-l]'); if (l && dragI !== null) { e.preventDefault(); $$('.lyr.over').forEach((x) => x.classList.remove('over')); l.classList.add('over'); } });
document.addEventListener('drop',      (e) => { const l = e.target.closest('[data-l]'); if (!l || dragI === null) return; e.preventDefault(); const from = dragI, to = +l.dataset.l, x = items.splice(from, 1)[0]; const adj = from < to ? to - 1 : to; items.splice(adj, 0, x); dragI = null; pick(adj); });
document.addEventListener('dragend',   () => { dragI = null; $$('.lyr').forEach((x) => x.classList.remove('dragging', 'over')); });

const setZ = (z) => { zoom = Math.max(.4, Math.min(1.6, z)); $('#zv').textContent = Math.round(zoom * 100) + '%'; renderCanvas(); };
$('#zIn').onclick  = () => setZ(zoom + .2);
$('#zOut').onclick = () => setZ(zoom - .2);
$('#zFit').onclick = () => setZ(($('#canvas').clientWidth - 72) / (560 * 2 + 28));
$('#present').onclick = (e) => { e.preventDefault(); window.open(`v2m-meeting-run.html?m=${kind === 'exec' ? 'exec' : 'share'}&view=present`, 'v2w-present', 'width=1280,height=720'); };
$('#ppt').onclick  = () => toast('PPT를 만들고 있습니다 — 캔버스와 같은 모양입니다(시안)');
$('#primary').onclick = main;

all();
</script>
</body>
</html>
