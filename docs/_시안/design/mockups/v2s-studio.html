<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>최종 시안 — 회의자료 스튜디오</title>
<link rel="stylesheet" href="../../app/static/css/fonts.css">
<link rel="stylesheet" href="v2b.css">
<link rel="stylesheet" href="v2s.css">
<style>
/* 최종 시안 — 회의자료 스튜디오(부서 자료·공유회·팀장 정보회의, ?kind=). 셸은 v2s.css */
.lyr{grid-template-columns:22px minmax(0,1fr) auto;cursor:pointer;font-size:var(--fs-2)}
.lyr .n{font-family:var(--mono);color:var(--muted);font-size:var(--fs-1)}
.lyr .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr .src{grid-column:2/-1;font-size:var(--fs-1);color:var(--muted)}
.lyr .f{font-size:var(--fs-1);color:var(--muted)}
.lyr.dragging{opacity:.4} .lyr.over{box-shadow:inset 0 2px 0 var(--accent)}
.cand{grid-template-columns:minmax(0,1fr) auto;font-size:var(--fs-2)}
.cand .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .m{grid-column:1;font-size:var(--fs-1);color:var(--muted)}
.dsub{grid-template-columns:minmax(0,1fr) auto;font-size:var(--fs-2)}
</style>
</head>
<body>
<header class="tb" id="tb"></header>
<div class="studio">
  <aside class="pane left" aria-label="장과 후보">
    <div class="seg" role="tablist" style="display:flex"><button type="button" data-tab="lyr" aria-pressed="true" style="flex:1">장 <span class="mono" id="nL"></span></button><button type="button" data-tab="cand" aria-pressed="false" style="flex:1">후보 <span class="mono" id="nC"></span></button></div>
    <div data-p="lyr"><div class="sec-h">끌어서 순서 · Shift+클릭으로 여러 장</div><div class="group" id="layers"></div></div>
    <div data-p="cand" hidden id="candP"></div>
  </aside>
  <main class="canvas" id="canvas" aria-label="캔버스"></main>
  <aside class="pane right" aria-label="속성" id="props"></aside>
</div>

<script type="module">
import {$, $$, esc, toast, fitStages} from './v2b.js';
import {ISSUES, KIND, SUBMIT, ptag, byId, MEETING, coverSlide} from './v2b-data.js';
import {toolbar, slide, frame as frame0, formPicker, FORMS} from './v2s.js';
toolbar('meet', 'v2b-studio.html' + location.search);
$('#act').innerHTML = `<a class="btn sm gray" href="v2s-meetings.html">‹ 회의</a><div class="seg" role="group" aria-label="갈래" id="kinds"><button type="button" data-k="dept">부서 자료</button><button type="button" data-k="share">공유회</button><button type="button" data-k="exec">팀장 정보회의</button></div><div class="zoom" aria-label="확대"><button type="button" id="zOut" aria-label="축소">−</button><output id="zv">100%</output><button type="button" id="zIn" aria-label="확대">＋</button><button type="button" id="zFit">맞춤</button></div><button class="btn sm gray" type="button" id="ppt">PPT</button><a class="btn sm gray" href="#" id="present">발표 미리보기</a><button class="btn sm primary" type="button" id="primary"></button>`;
const qs = new URLSearchParams(location.search);
const kind = ['dept', 'share', 'exec'].includes(qs.get('kind')) ? qs.get('kind') : 'dept';
$$('#kinds [data-k]').forEach((b) => { b.setAttribute('aria-pressed', b.dataset.k === kind); b.onclick = () => (location.search = '?kind=' + b.dataset.k); });
const K = {
  dept: {title: 'W43 시운전1부 회의자료', sub: '부서 회의자료 · 마감 10/22(수) 14:00 → 부서 현안 공유회', main: '제출', after: ['공유회 자료 보기 →', 'v2s-meetings.html?m=share'], form: 'card', fact: true},
  share: {title: MEETING.share, sub: '부서 현안 공유회 · 기획 취합 · 부서 제출본은 참조(내용 수정은 부서 자료·이슈에서)', main: '발행', after: ['회의 시작 →', 'v2s-run.html?m=share'], form: 'card', fact: false},
  exec: {title: MEETING.exec, sub: '팀장 정보회의 · 같은 이슈를 한 줄로 다시 구성 · 이슈는 그대로', main: '발행', after: ['회의 시작 →', 'v2s-run.html?m=exec'], form: 'line', fact: false},
}[kind];
$('#title').textContent = K.title;
const mine = ISSUES.filter((d) => d.dept === '시운전1부');
const LAST = ['ISS-2026-0001', 'PRB-2026-0001'];
// 후보 묶음 — 갈래마다 다르고 나머지 동작은 같다(B안)
const GROUPS = kind === 'dept' ? [['새 초안 — 초안 완료', mine.filter((d) => d.draft === 'ok' && !LAST.includes(d.id))], ['지난주 자료에 있던 것', mine.filter((d) => LAST.includes(d.id))], ['초안 작성 중 — 넣으면 경고만', mine.filter((d) => d.draft !== 'ok')]]
  : kind === 'share' ? [['종결 요청', ISSUES.filter((d) => d.st === 'req')], ['일정 임박 (D-14 이내)', ISSUES.filter((d) => d.dd !== null && d.dd <= 14 && d.st !== 'req')], ['그 밖의 열린 이슈', ISSUES.filter((d) => !(d.dd !== null && d.dd <= 14) && d.st !== 'req')]]
  : [['공유회 채택분', ISSUES.filter((d) => ['ISS-2026-0001', 'PRB-2026-0001', 'ISS-2026-0009'].includes(d.id))], ['중요 표시', ISSUES.filter((d) => d.important)], ['장기 미결 (4주 이상)', ISSUES.filter((d) => d.weeks >= 4 && !d.important)]];
const mk = (d, src) => ({id: d.id, line: d.wk || d.last, form: K.form, tag: true, src});
let items = [], sel = 0, zoom = 1, published = false, started = kind !== 'dept';
const multi = new Set();
if (kind === 'share') items = ISSUES.filter((d) => SUBMIT[d.dept] === 'ok' || d.dept === '시운전1부').slice(0, 6).map((d) => mk(d, d.dept + ' 제출'));
if (kind === 'exec') items = GROUPS[0][1].concat(GROUPS[1][1]).map((d) => mk(d, '공유회'));
items.forEach((it) => { if (byId(it.id).sym && kind !== 'exec' && byId(it.id).dec) it.form = 'detail'; });

const W = () => Math.round(560 * zoom);
const frame = (html, label, cls, attrs) => frame0(html, label, cls, attrs, W());
function renderCanvas() {
  if (!started) {
    $('#canvas').innerHTML = `<div class="startc"><b style="font-size:var(--fs-4)">이번 주 자료를 어떻게 시작할까요?</b><div class="row"><button class="btn primary" type="button" data-start="carry">지난주 이어받기 — ${LAST.length}건 + 새 초안 ${GROUPS[0][1].length}건</button><button class="btn gray" type="button" data-start="blank">빈 자료에서</button></div><span class="small muted">다음 주에는 이번에 고른 방식으로 바로 시작합니다(부서별 기억).</span></div>`;
    return;
  }
  const total = items.length + 1;
  let h = `<div class="rowf">${frame(coverSlide(K.title, items.map((x) => ({d: byId(x.id)})), total), '<b>1 · 표지</b>', '', '')}</div>`;
  items.forEach((it, i) => {
    const on = i === sel;
    h += `<div class="rowf" data-row="${i}">${frame(slide(it, i + 2, total, K.title), `<b>${i + 2} · ${esc((it.ids ? it.line : byId(it.id).title).slice(0, 28))}</b><span>${FORMS[it.form]}</span>`, on ? 'on' : multi.has(i) ? 'multi' : '', `data-f="${i}"`)}`;
    if (on && multi.size < 2 && !it.ids) h += `<span class="vars-h">다른 형태</span>` + Object.keys(FORMS).filter((k) => k !== it.form).map((k) => frame(slide({...it, form: k}, i + 2, total, K.title), `<b>${FORMS[k]}</b> 로 바꾸기`, 'var', `data-var="${k}"`)).join('');
    h += '</div>';
  });
  if (!items.length) h += '<div class="startc"><b>장이 없습니다</b><span class="small muted">왼쪽 「후보」에서 ＋ 를 누르면 장이 생깁니다.</span></div>';
  $('#canvas').innerHTML = h;
  fitStages();
}
function renderLeft() {
  $('#layers').innerHTML = `<div class="cell lyr" style="cursor:default"><span class="n">1</span><span class="t">표지</span><span></span></div>` + items.map((it, i) => { const d = byId(it.id); return `<div class="cell lyr ${i === sel ? 'on' : multi.has(i) ? 'multi' : ''}" data-l="${i}" draggable="true"><span class="n">${i + 2}</span><span class="t">${it.ids ? '<span class="tl decide" style="margin-right:4px">요약</span>' + esc(it.line) : `<span class="tl ${d.t}" style="margin-right:4px">${KIND[d.t]}</span>${esc(d.title)}`}</span><span class="f">${FORMS[it.form]}</span>${it.src ? `<span class="src">${esc(it.src)}</span>` : ''}</div>`; }).join('');
  const used = new Set(items.flatMap((x) => x.ids || [x.id]));
  let h = '';
  if (kind === 'share') h += `<div class="sec-h">부서 제출 — 마감 수 14:00 지남</div><div class="group">` + Object.entries(SUBMIT).map(([dpt, v]) => `<div class="cell dsub"><span>${dpt} <span class="st ${v === 'ok' ? 'done' : 'late'}">${v === 'ok' ? '제출' : v === 'wip' ? '작성 중' : '미작성'}</span></span>${v === 'ok' ? '' : `<button class="btn sm" type="button" data-fill="${dpt}">원장으로 채우기</button>`}</div>`).join('') + '</div>';
  let nC = 0;
  h += GROUPS.map(([g, xs]) => { const rest = xs.filter((d) => !used.has(d.id)); nC += rest.length; return rest.length ? `<div class="sec-h">${g} ${rest.length}</div><div class="group">` + rest.map((d) => `<div class="cell cand"><span class="t"><span class="tl ${d.t}" style="margin-right:4px">${KIND[d.t]}</span>${esc(d.title)}</span><button class="btn sm" type="button" data-add="${d.id}" aria-label="${d.id} 장으로 넣기">＋</button><span class="m">${d.id} · ${d.dept}${d.map < 3 ? ' · 매핑 ' + d.map + '/5' : ''}</span></div>`).join('') + '</div>' : ''; }).join('');
  $('#candP').innerHTML = h || '<div class="empty">모든 후보가 들어가 있습니다</div>';
  $('#nL').textContent = items.length + 1; $('#nC').textContent = nC;
}
const KEYS = '<div class="keys"><kbd>↑</kbd><kbd>↓</kbd> 장 고르기 · <kbd>1</kbd>~<kbd>4</kbd> 형태 · <kbd>Delete</kbd> 빼기 · <kbd>Ctrl</kbd>+<kbd>S</kbd> ' + K.main + '</div>';
function renderProps() {
  if (multi.size >= 2) {
    $('#props').innerHTML = `<div class="prop"><b>${multi.size}장 골랐습니다</b><span class="small muted">같은 원인·장비라면 한 장으로 묶어 보여 줄 수 있습니다. 각 이슈는 그대로 남습니다.</span></div><button class="btn primary" type="button" id="sumBtn">고른 ${multi.size}장 한 장으로 요약</button><button class="btn gray" type="button" id="clrM">고르기 풀기</button>` + KEYS; return;
  }
  const it = items[sel];
  if (!it) { $('#props').innerHTML = '<div class="empty">장을 고르면 여기에서 형태·한 줄·사실을 고칩니다</div>' + KEYS; return; }
  const d = byId(it.id), p = ptag(d);
  if (it.ids) { $('#props').innerHTML = `<div class="prop"><span class="small muted">${sel + 2}장 · 요약</span><b>이슈 ${it.ids.length}건 묶음</b><span class="meta">${it.ids.map((x) => `<a href="v2s-issue.html?id=${x}">${x}</a>`).join(' ')}</span></div><div class="sec-h">요약 문장</div><div class="prop"><span class="expr">이 자료에만 — 각 이슈는 그대로</span><input type="text" id="ln" value="${esc(it.line)}"></div><div class="row"><button class="btn sm gray" type="button" id="unsum">요약 풀기</button><button class="btn sm gray" type="button" id="drop">이 장 빼기</button></div>` + KEYS; return; }
  $('#props').innerHTML = `
    <div class="prop"><span class="small muted">${sel + 2}장 · ${d.id}${it.src ? ' · ' + esc(it.src) : ''}</span><b>${esc(d.title)}</b><span class="meta"><span>${d.dept}</span><span class="dd ${d.dd !== null && d.dd <= 14 ? 'soon' : ''}">${d.hull} · ${esc(d.ev)}${d.dd !== null ? ' D-' + d.dd : ''}</span>${d.draft !== 'ok' ? '<span class="st late">초안 작성 중</span>' : ''}</span></div>
    <div class="sec-h">형태 — 캔버스 옆 변형을 눌러도 됩니다</div>
    ${formPicker(it.form)}
    <div class="sec-h">회의용 한 줄</div>
    <div class="prop"><span class="expr">이 자료에만 — 이슈는 그대로</span>${p ? `<button class="ptag" type="button" id="tag" aria-pressed="${it.tag}">[${esc(p)}]</button>` : ''}<label class="sr" for="ln">회의용 한 줄</label><input type="text" id="ln" value="${esc(it.line)}"></div>
    ${K.fact ? `<div class="sec-h">사실</div><div class="fact"><span class="lbl">고치면 이슈에 바로 반영 · 작성자 알림</span><label class="f">원인<input type="text" data-fact="cause" value="${esc(d.cause || '')}" placeholder="조사 중"></label><label class="f">조치 · 계획<input type="text" data-fact="act" value="${esc(d.act || '')}"></label><label class="f">결정 필요<input type="text" data-fact="dec" value="${esc(d.dec || '')}"></label></div>`
      : `<span class="small muted">사실 수정은 부서 자료나 이슈에서 — 여기서는 순서·형태·한 줄만</span>`}
    <div class="row" style="margin-top:4px"><a class="btn sm gray" href="v2s-issue.html?id=${d.id}">이슈 열기</a><button class="btn sm gray" type="button" id="drop">이 장 빼기</button></div>` + KEYS;
}
function state() {
  const n = items.length;
  $('#sub').textContent = published ? `${K.sub.split(' · ')[0]} · ${K.main === '제출' ? '제출함' : '발행 1판'} · 이후 바뀐 사실은 「변경」으로 표시` : `${K.sub} · 장 ${n + 1} · 자동 저장됨`;
  $('#primary').textContent = published ? K.after[0] : K.main;
}
const all = () => { renderLeft(); renderCanvas(); renderProps(); state(); };
function pick(i, scroll = true) { multi.clear(); sel = Math.max(0, Math.min(items.length - 1, i)); all(); if (scroll) $(`[data-row="${sel}"]`)?.scrollIntoView({block: 'center', behavior: 'smooth'}); }
function setForm(k) { const it = items[sel]; if (!it || it.ids || it.form === k) return; const b = it.form; it.form = k; all(); toast(`${sel + 2}장을 「${FORMS[k]}」로 바꿨습니다`, () => { it.form = b; all(); }); }
function drop() { if (!items.length) return; const i = sel, x = items.splice(i, 1)[0]; sel = Math.max(0, Math.min(i, items.length - 1)); all(); toast(`${x.ids ? '요약' : '「' + byId(x.id).title + '」'} 장을 뺐습니다`, () => { items.splice(i, 0, x); pick(i); }); }
function main() {
  if (published) { location.href = K.after[1]; return; }
  published = true; all();
  toast(K.main === '제출' ? '제출했습니다 — 공유회 자료에 들어갔습니다. 고치면 「변경」으로 표시됩니다' : '발행했습니다 — 이 판은 고정됩니다', () => { published = false; all(); });
}
document.addEventListener('click', (e) => {
  const f = e.target.closest('[data-f]'), v = e.target.closest('[data-var]'), l = e.target.closest('[data-l]'), fm = e.target.closest('[data-form]'), add = e.target.closest('[data-add]'), tab = e.target.closest('[data-tab]'), st = e.target.closest('[data-start]'), fill = e.target.closest('[data-fill]');
  if (st) { started = true; if (st.dataset.start === 'carry') items = GROUPS[1][1].map((d) => mk(d, '지난주')).concat(GROUPS[0][1].map((d) => mk(d, '새 초안'))); sel = 0; all(); toast(st.dataset.start === 'carry' ? `지난주 ${LAST.length}건 + 새 초안 ${GROUPS[0][1].length}건으로 시작했습니다` : '빈 자료로 시작했습니다 — 왼쪽 「후보」에서 넣으세요'); return; }
  if (v) return setForm(v.dataset.var);
  if ((f || l) && e.shiftKey) { const i = +(f || l).dataset[f ? 'f' : 'l']; if (!multi.size) multi.add(sel); multi.has(i) ? multi.delete(i) : multi.add(i); all(); return; }
  if (f) return pick(+f.dataset.f, false);
  if (l) return pick(+l.dataset.l);
  if (fm) return setForm(fm.dataset.form);
  if (e.target.id === 'tag') { items[sel].tag = !items[sel].tag; all(); return; }
  if (e.target.id === 'drop') return drop();
  if (e.target.id === 'clrM') { multi.clear(); all(); return; }
  if (e.target.id === 'sumBtn') { const idx = [...multi].sort((a, b) => a - b), pickd = idx.map((i) => items[i]), ids = pickd.flatMap((x) => x.ids || [x.id]); const at = idx[0]; items = items.filter((_, i) => !multi.has(i)); items.splice(at, 0, {id: ids[0], ids, line: `${ids.length}건 묶음 — ${[...new Set(ids.map((x) => byId(x).hull))].join('·')} 같은 원인 검토`, form: 'card', tag: false, src: `요약 · 이슈 ${ids.length}개 연결`}); multi.clear(); sel = at; all(); toast(`${ids.length}건을 한 장으로 묶었습니다 — 각 이슈는 그대로입니다`, () => { items.splice(at, 1, ...pickd); pick(at); }); return; }
  if (e.target.id === 'unsum') { const it = items[sel], parts = it.ids.map((x) => mk(byId(x), '요약에서 풂')); items.splice(sel, 1, ...parts); all(); return; }
  if (add) { const d = byId(add.dataset.add); started = true; items.push(mk(d, kind === 'dept' ? '새로 넣음' : '원장에서')); pick(items.length - 1); toast(`「${d.title}」을 ${items.length + 1}장으로 넣었습니다`, () => { items = items.filter((x) => x.id !== d.id || x.ids); pick(sel); }); return; }
  if (fill) { const dpt = fill.dataset.fill, used = new Set(items.flatMap((x) => x.ids || [x.id])), add2 = ISSUES.filter((d) => d.dept === dpt && !used.has(d.id)); add2.forEach((d) => items.push(mk(d, dpt + ' · 원장 자동'))); all(); toast(add2.length ? `${dpt} 미제출 — 열린 이슈 ${add2.length}건을 원장에서 채웠습니다. 부서가 제출하면 바뀝니다` : `${dpt}: 원장에 열린 이슈가 없어 「미제출」로만 표시합니다`); return; }
  if (tab) { $$('[data-tab]').forEach((b) => b.setAttribute('aria-pressed', b === tab)); $$('[data-p]').forEach((p) => (p.hidden = p.dataset.p !== tab.dataset.tab)); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'ln') { items[sel].line = e.target.value; renderCanvas(); }
  if (e.target.dataset.fact) { byId(items[sel].id)[e.target.dataset.fact] = e.target.value; renderCanvas(); $('#sub').textContent = `● ${items[sel].id} 이슈에 반영됨 · 작성자에게 알림`; }
});
addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); main(); return; }
  if (e.target.closest?.('input,textarea,select')) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); pick(sel + 1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); pick(sel - 1); }
  if (['1', '2', '3', '4'].includes(e.key)) setForm(Object.keys(FORMS)[+e.key - 1]);
  if (e.key === 'Delete') { e.preventDefault(); drop(); }
});
let dragI = null;
document.addEventListener('dragstart', (e) => { const l = e.target.closest('[data-l]'); if (l) { dragI = +l.dataset.l; l.classList.add('dragging'); } });
document.addEventListener('dragover', (e) => { const l = e.target.closest('[data-l]'); if (l && dragI !== null) { e.preventDefault(); $$('.lyr.over').forEach((x) => x.classList.remove('over')); l.classList.add('over'); } });
document.addEventListener('drop', (e) => { const l = e.target.closest('[data-l]'); if (!l || dragI === null) return; e.preventDefault(); const to = +l.dataset.l, x = items.splice(dragI, 1)[0]; items.splice(to, 0, x); dragI = null; pick(to); });
document.addEventListener('dragend', () => { dragI = null; $$('.lyr').forEach((x) => x.classList.remove('dragging', 'over')); });
const setZ = (z) => { zoom = Math.max(.4, Math.min(1.6, z)); $('#zv').textContent = Math.round(zoom * 100) + '%'; renderCanvas(); };

$('#zFit').onclick = () => setZ(($('#canvas').clientWidth - 72) / (560 * 2 + 28));
