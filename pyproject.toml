[project]
name = "meeting-v"
version = "0.1.0"
description = "커미셔닝팀 주간 회의자료·지식화 (사외망 작업본)"
requires-python = ">=3.11"

# 필수 — diagnostics/check_libs.py 의 REQUIRED 와 같아야 한다.
dependencies = [
    "streamlit>=1.40",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "python-pptx>=1.0",
]

# 선택 — 사외망에서 설치가 막힐 수 있다. 없으면 code-gen.md §4⑦ 강등 경로를 쓴다.
# 설치: uv sync --extra ui
[project.optional-dependencies]
ui = [
    "streamlit-aggrid>=1.0",
    "streamlit-drawable-canvas>=0.9",
]

# 공개 데모 전용 — 외부 LLM(Claude). 사내망 고정본에서는 **깔지 않는다**
# (`CLAUDE.md` §3·§6-9 의 예외, `modules/llm_client.py` 머리글).
demo = [
    "anthropic>=0.40",
    "openai>=1.50",
]

# 개발용 — 앱이 도는 데는 필요 없다. 그래서 `dependencies` 와 `check_libs.py` 의 REQUIRED 에
# 넣지 않는다. `uv run pytest` 를 쓰면 uv 가 이 묶음을 알아서 함께 깔아 준다.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # 저장소 뿌리에서 `modules`·`views` 를 그대로 임포트한다 (패키지로 깔지 않는다)
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
