# Streamlit 설정. 포트를 바꾸면 .claude/launch.json 의 port 도 같이 바꾼다.

[server]
port = 8501
headless = true
fileWatcherType = "auto"
maxUploadSize = 50
# 저장소 루트의 static/ 를 /app/static/ 으로 내어 준다 — 글꼴 서브셋(static/fonts/)이 여기로 받아진다.
# 끄면 글꼴만 안 받아지고 대체 사슬(맑은 고딕)로 떨어진다. 화면은 그대로 뜬다.
enableStaticServing = true

[browser]
# 사외망·사내망 모두 외부로 사용 통계를 보내지 않는다.
gatherUsageStats = false

[theme]
# 시안 토큰(docs/_시안/design/tokens.css)의 **라이트 값**이다. 2026-11-12 결정으로
# 다크 모드는 받지 않는다 — 시안에는 다크도 있지만 앱은 라이트 하나로 간다.
# 나머지 토큰(의미 색·글꼴·크기)은 views/theme.py 가 CSS 로 넣는다.
base = "light"
primaryColor = "#0963c4"             # --accent
backgroundColor = "#eef1f5"          # --bg
secondaryBackgroundColor = "#ffffff" # --surface
textColor = "#111114"                # --fg

[runner]
# 상호작용마다 스크립트를 처음부터 다시 돈다 (code-gen.md §4④).
# 마지막 식을 자동 출력하지 않게 둔다 — 화면에 군더더기가 찍히는 것을 막는다.
magicEnabled = false
